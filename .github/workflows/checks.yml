name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-groups
      - run: uv run --locked --all-groups ruff check .
      - run: uv run --locked --all-groups ruff format --check .
      - run: uv run --locked --all-groups ty check src
