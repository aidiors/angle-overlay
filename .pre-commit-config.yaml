repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --all-groups ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --all-groups ruff format
        language: system
        types: [python]

      - id: ty
        name: ty type check
        entry: uv run --locked --all-groups ty check src
        language: system
        pass_filenames: false
        stages: [pre-push]
